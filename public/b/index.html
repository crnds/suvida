<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover pairs with the env(safe-area-inset-*) padding in
     theme.css so the sticky header clears the iPhone notch and the bottom
     sheet clears the home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf9f6">
<title>Suvida Piano Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Only the weights theme.css actually uses. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/solid.min.css">
<link rel="stylesheet" href="/shared/theme.css">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y_skip_to_content"></a>

<header class="app-header">
  <h1 class="app-header__brand" id="brand-name">Suvida Piano Studio</h1>
  <div class="app-header__actions">
    <div id="lang-toggle"></div>
  </div>
</header>

<main class="page" id="main">
  <!-- role="alert" so a student arriving on a stale link actually hears why
       the page is empty. This is the one hand-rolled banner in the app; every
       other one comes from UI.banner(), which sets the role for the error
       kind and adds the icon. -->
  <div id="not-found" class="hidden" role="alert">
    <p class="banner banner--error">
      <i class="fa-solid fa-circle-exclamation icon" aria-hidden="true"></i><span class="banner__text" data-i18n="booker_teacher_not_found"></span>
    </p>
  </div>

  <div id="app-body" class="hidden">
    <nav class="tabs" role="tablist" data-i18n-aria-label="a11y_sections">
      <button class="tab" role="tab" id="tab-btn-book" aria-selected="true">
        <i class="fa-solid fa-calendar-days icon" aria-hidden="true"></i><span data-i18n="booker_tab_book"></span>
      </button>
      <button class="tab" role="tab" id="tab-btn-history" aria-selected="false">
        <i class="fa-solid fa-clock-rotate-left icon" aria-hidden="true"></i><span data-i18n="booker_tab_history"></span>
      </button>
    </nav>

    <section id="tab-book" class="stack-tight">
      <h2 class="text-h3" data-i18n="booker_pick_day"></h2>
      <div id="location-filter" class="row-wrap" role="group"></div>
      <div id="calendar"></div>
    </section>

    <section id="tab-history" class="hidden stack">
      <div class="section">
        <div class="section__head">
          <h2 class="section__title" data-i18n="booker_history_local_title"></h2>
        </div>
        <div id="local-bookings" class="list"></div>
      </div>

      <div class="section">
        <div class="section__head">
          <h2 class="section__title" data-i18n="booker_history_lookup_title"></h2>
        </div>
        <p class="text-helper measure" data-i18n="booker_history_lookup_hint"></p>
        <form id="lookup-form" class="form-row" novalidate>
          <div class="field field--grow">
            <label for="lookup-phone" data-i18n="booker_history_lookup_phone_label"></label>
            <input class="input" type="tel" id="lookup-phone" maxlength="20" inputmode="tel"
                   autocomplete="tel"
                   data-i18n-placeholder="booker_history_lookup_phone"
                   aria-describedby="lookup-error" required>
          </div>
          <button class="btn btn-primary" type="submit" id="lookup-submit">
            <i class="fa-solid fa-magnifying-glass icon" aria-hidden="true"></i><span data-i18n="booker_history_lookup_btn"></span>
          </button>
        </form>
        <div id="lookup-error" class="field-error hidden" role="alert"></div>
        <div id="lookup-results" class="list"></div>
      </div>
    </section>
  </div>
</main>

<div id="modal-root"></div>

<script src="/shared/i18n.js"></script>
<script src="/shared/format.js"></script>
<script src="/shared/validate.js"></script>
<script src="/shared/api.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/calendar.js"></script>
<script src="/b/page.js"></script>
</body>
</html>
